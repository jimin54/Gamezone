<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<meta name="description" content="超可愛的打磚塊線上免費玩,接住愛心和糖果道具,手機電腦都能玩,挑戰你的最高分!">
<meta property="og:title" content="可愛打磚塊 - 免費線上小遊戲">
<meta property="og:description" content="超可愛的打磚塊線上免費玩,挑戰你的最高分!">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

<style>
  :root { --bg:#fff1f5; --card:#ffe4ec; --accent:#ff7eb6; --text:#6b3a4e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px; }
  h1 { margin:4px 0 4px; font-size:1.6rem; letter-spacing:2px; }
  nav { font-size:.85rem; margin-bottom:6px; }
  nav a { color:#c06a8f; margin:0 8px; text-decoration:none; font-weight:600; }
  nav a:hover { color:var(--accent); }
  .ad { width:100%; max-width:420px; min-height:60px; margin:8px 0; background:#ff7eb614; border:1px dashed #ff7eb655;
        border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:.75rem; color:#b08795; overflow:hidden; }
  .bar { width:100%; max-width:420px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:6px; font-weight:700; font-size:.9rem; }
  .box { background:var(--card); border-radius:16px; padding:4px 10px; text-align:center; min-width:56px; }
  .box small { display:block; font-size:.62rem; color:#b08795; font-weight:500; }
  .wrap { position:relative; width:100%; max-width:420px; }
  canvas { width:100%; aspect-ratio:400/560; border-radius:20px; display:block; touch-action:none;
           border:4px solid #ffc2d9; box-shadow:0 6px 18px #ff7eb633; background:#fff7fa; }
  .overlay { position:absolute; inset:0; background:#fff1f5ee; border-radius:20px; display:flex; flex-direction:column;
             align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px; }
  .overlay.hidden { display:none; }
  .big { font-size:3rem; line-height:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:10px 26px; font-size:1rem; font-weight:700; cursor:pointer;
           box-shadow:0 4px 0 #e0599a; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #e0599a; }
  button.ghost { background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none; }
  button.hidden { display:none; }
  .tools { width:100%; max-width:420px; text-align:center; margin-top:10px; font-size:.8rem; color:#b08795; line-height:1.6; }
  footer { margin-top:auto; padding:12px; font-size:.75rem; color:#b08795; }
</style>
</head>
<body>
  <h1>🧱 可愛打磚塊 🍬</h1>
  <nav><a href="index.html">🐍 貪食蛇</a><a href="2048.html">🐣 2048</a><a href="memory.html">🐰 翻翻樂</a><a href="breakout.html">🧱 打磚塊</a></nav>

  <!-- ====== 廣告位 1:頂部橫幅 ====== -->
  <div class="ad" id="ad-top">廣告位(頂部橫幅 320x50)</div>

  <div class="bar">
    <div class="box"><small>分數</small><span id="score">0</span></div>
    <div class="box"><small>關卡</small><span id="level">1</span></div>
    <div class="box"><small>生命</small><span id="lives">❤️❤️❤️</span></div>
    <button class="ghost" id="muteBtn" style="padding:4px 12px;box-shadow:none" aria-label="音效開關">🔊</button>
    <div class="box"><small>最高</small><span id="best">0</span></div>
  </div>

  <div class="wrap">
    <canvas id="c" width="800" height="1120"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovEmoji">🧱</div>
      <h2 id="ovTitle" style="margin:0">準備好打磚塊了嗎?</h2>
      <div id="ovMsg">手指放在小板下方左右滑動控制小板,點一下發球!</div>
      <button id="startBtn">開始遊戲</button>
      <button class="ghost hidden" id="shareBtn">邀請朋友來挑戰</button>
    </div>
  </div>

  <div class="tools">手指放在小板下方的空白處左右滑動,小板會跟著移動(不用對準小板)<br>接住 💗 加一條命、🍬 讓小板變寬<br>電腦可用滑鼠、方向鍵 / A D,空白鍵發球</div>

  <!-- ====== 廣告位 2:遊戲下方 ====== -->
  <div class="ad" id="ad-bottom">廣告位(遊戲下方 300x250)</div>

  <footer>© 2026 小遊戲專區</footer>

<script>
(() => {
  const W = 400, H = 560;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  const overlay = $('overlay'), startBtn = $('startBtn'), shareBtn = $('shareBtn');

  // ====== 音效(Web Audio,不需要音檔) ======
  let audio = null, muted = false;
  try { muted = localStorage.getItem('muteBreakout') === '1'; } catch(e) {}
  const muteBtn = $('muteBtn');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.onclick = () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('muteBreakout', muted ? '1' : '0'); } catch(e) {}
  };
  function tone(freq, start, dur, type = 'sine', vol = 0.12) {
    const o = audio.createOscillator(), gn = audio.createGain();
    o.type = type; o.frequency.value = freq;
    const t0 = audio.currentTime + start;
    gn.gain.setValueAtTime(vol, t0);
    gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn); gn.connect(audio.destination);
    o.start(t0); o.stop(t0 + dur);
  }
  function sfx(name, n = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      if (name === 'wall') tone(300, 0, .05, 'triangle', .06);
      else if (name === 'paddle') tone(440, 0, .07, 'triangle', .1);
      else if (name === 'brick') tone(420 + n * 45, 0, .09, 'triangle', .11);
      else if (name === 'hard') tone(250, 0, .08, 'square', .05);
      else if (name === 'power') { tone(660, 0, .08, 'triangle'); tone(990, .07, .12, 'triangle'); }
      else if (name === 'lose') [392, 311, 233].forEach((f, i) => tone(f, i * .12, .18, 'sine', .15));
      else if (name === 'level') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .16, 'triangle', .15));
      else if (name === 'over') [523, 440, 349, 262].forEach((f, i) => tone(f, i * .14, .2, 'sine', .18));
      else if (name === 'start') [523, 659, 784].forEach((f, i) => tone(f, i * .08, .12, 'triangle', .13));
    } catch(e) {}
  }

  const BASE_W = 84, WIDE_W = 132;
  const paddle = { x: W / 2, y: H - 130, w: BASE_W, h: 14 };
  const ball = { x: W / 2, y: 0, vx: 0, vy: 0, r: 8 };
  let state = 'menu', speed = 5, bricks = [], drops = [], parts = [], lives = 3, score = 0, level = 1,
      best = 0, wideUntil = 0, banner = null, shareText = '', plays = 0, last = 0;
  const keys = { left: false, right: false };
  try { best = +localStorage.getItem('breakoutBest') || 0; } catch(e) {}
  $('best').textContent = best;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function updateHud() {
    $('score').textContent = score;
    $('level').textContent = level;
    $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) || '💔';
  }

  function buildBricks() {
    bricks = [];
    const cols = 8, rows = Math.min(8, 3 + level), gap = 6, mx = 16;
    const bw = (W - mx * 2 - gap * (cols - 1)) / cols, bh = 20;
    const hues = [340, 20, 48, 140, 185, 215, 265, 310];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      bricks.push({ x: mx + c * (bw + gap), y: 62 + r * (bh + gap), w: bw, h: bh, row: r, hue: hues[r % 8],
                    hp: r < Math.min(level - 1, 3) ? 2 : 1 });
    }
  }
  function resetBall() {
    ball.vx = ball.vy = 0;
    ball.x = paddle.x; ball.y = paddle.y - ball.r - 1;
    state = 'ready';
  }
  function launch() {
    if (state !== 'ready') return;
    const a = (Math.random() - .5) * 0.6;
    ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a);
    state = 'play'; sfx('paddle');
  }
  function startGame() {
    level = 1; score = 0; lives = 3; speed = 5; wideUntil = 0; paddle.w = BASE_W; paddle.x = W / 2;
    drops = []; parts = []; banner = null; plays++;
    buildBricks(); resetBall(); updateHud();
    overlay.classList.add('hidden');
    sfx('start');
  }
  function burst(x, y) {
    for (let i = 0; i < 5; i++)
      parts.push({ x, y, vx: (Math.random() - .5) * 2.4, vy: -1 - Math.random() * 1.6, life: 1, e: ['💗', '✨', '⭐'][i % 3] });
  }
  function nextLevel() {
    level++; speed = Math.min(9, 5 + (level - 1) * 0.5);
    buildBricks(); resetBall(); drops = []; updateHud();
    banner = { text: `第 ${level} 關 ✨`, until: performance.now() + 1600 };
    sfx('level');
  }
  function hitBrick(b) {
    b.hp--;
    if (b.hp <= 0) {
      score += 10; burst(b.x + b.w / 2, b.y + b.h / 2);
      if (Math.random() < 0.14) drops.push({ x: b.x + b.w / 2, y: b.y + b.h, type: Math.random() < 0.35 ? 'life' : 'wide' });
      sfx('brick', b.row);
    } else { score += 3; sfx('hard'); }
    updateHud();
    if (bricks.every(x => x.hp <= 0)) nextLevel();
  }
  function loseBall() {
    lives--; sfx('lose'); drops = []; updateHud();
    if (lives <= 0) return gameOver();
    resetBall();
  }
  function gameOver() {
    state = 'over';
    if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem('breakoutBest', best); } catch(e) {} }
    const [em, msg] = score < 150 ? ['🌱', '再接再厲,下次會更好!'] : score < 500 ? ['🍬', '不錯喔,磚塊們都碎了好多!']
                    : score < 1200 ? ['✨', '好厲害!你是打磚塊高手!'] : ['🏆', '太神啦!磚塊們都怕你!'];
    $('ovEmoji').textContent = em;
    $('ovTitle').textContent = '遊戲結束~';
    $('ovMsg').innerHTML = `${msg}<br>本局 ${score} 分|闖到第 ${level} 關<br>最高 ${best} 分`;
    startBtn.textContent = '再玩一次';
    shareText = `我在可愛打磚塊拿到 ${score} 分、闖到第 ${level} 關,敢來挑戰嗎?`;
    shareBtn.textContent = '邀請朋友來挑戰';
    shareBtn.classList.remove('hidden');
    overlay.classList.remove('hidden');
    // ====== 廣告位 3:遊戲結束是插入廣告的好時機 ======
    // 例如每玩 3 局顯示一次插頁廣告:if (plays % 3 === 0) showInterstitialAd();
  }

  function update(dt) {
    if (keys.left) paddle.x -= 7 * dt;
    if (keys.right) paddle.x += 7 * dt;
    if (wideUntil && performance.now() > wideUntil) { wideUntil = 0; paddle.w = BASE_W; }
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

    if (state === 'ready') { ball.x = paddle.x; ball.y = paddle.y - ball.r - 1; }
    else if (state === 'play') {
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx('wall'); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx('wall'); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sfx('wall'); }

      // 小板
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 10 &&
          Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
        const hit = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1), a = hit * 1.05;
        ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a);
        ball.y = paddle.y - ball.r; sfx('paddle');
      }
      // 磚塊
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        const cx = clamp(ball.x, b.x, b.x + b.w), cy = clamp(ball.y, b.y, b.y + b.h);
        const dx = ball.x - cx, dy = ball.y - cy;
        if (dx * dx + dy * dy <= ball.r * ball.r) {
          const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (ox < oy) ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
          else ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
          hitBrick(b);
          break;
        }
      }
      // 維持固定速度,並避免球太水平
      if (state === 'play') {
        if (Math.abs(ball.vy) < speed * 0.25) ball.vy = (ball.vy < 0 ? -1 : 1) * speed * 0.25;
        const s = Math.hypot(ball.vx, ball.vy);
        ball.vx *= speed / s; ball.vy *= speed / s;
        if (ball.y - ball.r > H) loseBall();
      }
    }
    // 掉落道具
    drops = drops.filter(d => {
      d.y += 2.2 * dt;
      if (d.y > paddle.y && d.y < paddle.y + paddle.h + 14 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) {
        if (d.type === 'life') { lives = Math.min(5, lives + 1); updateHud(); }
        else { paddle.w = WIDE_W; wideUntil = performance.now() + 10000; }
        sfx('power'); return false;
      }
      return d.y < H + 20;
    });
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function draw(now) {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fff7fa'); bg.addColorStop(1, '#ffe9f1');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    bricks.forEach(b => {
      if (b.hp <= 0) return;
      rr(b.x, b.y, b.w, b.h, 7);
      ctx.fillStyle = b.hp === 2 ? `hsl(${b.hue},70%,68%)` : `hsl(${b.hue},85%,84%)`;
      ctx.fill();
      if (b.hp === 2) { ctx.strokeStyle = `hsl(${b.hue},70%,52%)`; ctx.lineWidth = 3; ctx.stroke(); }
      ctx.fillStyle = '#ffffff88'; rr(b.x + 4, b.y + 3, b.w - 8, 4, 2); ctx.fill();
    });

    ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    drops.forEach(d => ctx.fillText(d.type === 'life' ? '💗' : '🍬', d.x, d.y));

    // 小板(貓咪耳朵、眼睛、腮紅)
    const px = paddle.x - paddle.w / 2, py = paddle.y;
    ctx.fillStyle = '#ff9ec4';
    [[px + 8, 1], [px + paddle.w - 8, -1]].forEach(([ex, s]) => {
      ctx.beginPath(); ctx.moveTo(ex - 8 * s, py + 2); ctx.lineTo(ex + 2 * s, py - 9); ctx.lineTo(ex + 10 * s, py + 2); ctx.closePath(); ctx.fill();
    });
    rr(px, py, paddle.w, paddle.h, 8);
    const pg = ctx.createLinearGradient(0, py, 0, py + paddle.h);
    pg.addColorStop(0, '#ffb3d1'); pg.addColorStop(1, '#ff7eb6');
    ctx.fillStyle = pg; ctx.fill();
    ctx.fillStyle = '#3b2a33';
    ctx.beginPath(); ctx.arc(paddle.x - 9, py + 6, 2, 0, 7); ctx.arc(paddle.x + 9, py + 6, 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffffaa'; rr(px + 10, py + 2, paddle.w - 20, 2.5, 1); ctx.fill();

    // 球
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#ff7eb6'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#3b2a33';
    ctx.beginPath(); ctx.arc(ball.x - 2.6, ball.y - 1, 1.3, 0, 7); ctx.arc(ball.x + 2.6, ball.y - 1, 1.3, 0, 7); ctx.fill();

    // 愛心星星特效
    ctx.font = '14px serif';
    parts = parts.filter(q => q.life > 0);
    parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.life -= 0.03; ctx.globalAlpha = Math.max(0, q.life); ctx.fillText(q.e, q.x, q.y); });
    ctx.globalAlpha = 1;

    if (state === 'ready') {
      ctx.fillStyle = '#b08795'; ctx.font = '600 14px sans-serif';
      ctx.fillText('點一下發球 🍬', W / 2, H / 2 + 40);
      ctx.fillText('👆 手指放在這裡左右滑動', W / 2, H - 50);
    }
    if (banner && now < banner.until) {
      ctx.fillStyle = '#ff7eb6'; ctx.font = '800 34px sans-serif';
      ctx.fillText(banner.text, W / 2, H / 2);
    }
  }

  function frame(ts) {
    const dt = clamp((ts - (last || ts)) / 16.667, 0.1, 2.5); last = ts;
    if (state === 'play' || state === 'ready') update(dt);
    draw(ts);
    requestAnimationFrame(frame);
  }

  // 操作
  function setX(clientX) {
    const r = cv.getBoundingClientRect();
    paddle.x = clamp((clientX - r.left) / r.width * W, paddle.w / 2, W - paddle.w / 2);
  }
  // 手機:相對拖曳。小板在畫面偏上的位置,手指放在小板下方的空白區左右滑動,
  // 小板會依手指移動的距離跟著動(不會一碰就跳位置,也不用對準小板)
  // 滑鼠:小板直接跟著游標
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') setX(e.clientX);
    else { drag = { sx: e.clientX, px: paddle.x }; try { cv.setPointerCapture(e.pointerId); } catch(err) {} }
    if (state === 'ready') launch();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { setX(e.clientX); return; }
    if (!drag) return;
    const r = cv.getBoundingClientRect();
    paddle.x = clamp(drag.px + (e.clientX - drag.sx) / r.width * W * 1.4, paddle.w / 2, W - paddle.w / 2);
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'ready') launch(); else if (state === 'menu' || state === 'over') startGame();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });
  startBtn.onclick = startGame;
  shareBtn.onclick = async () => {
    const text = shareText || '來玩可愛打磚塊,挑戰最高分!';
    try {
      if (navigator.share) await navigator.share({ title: '可愛打磚塊', text, url: location.href });
      else { await navigator.clipboard.writeText(text + ' ' + location.href); shareBtn.textContent = '已複製連結!'; }
    } catch(e) {}
  };

  buildBricks(); resetBall(); state = 'menu';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
